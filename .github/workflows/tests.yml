name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0  # no moving v10 tag is published; pin the exact version
        with: {python-version: "3.12.16", version: "0.13.6"}
      - run: uv sync --locked --all-groups
      - run: uv run --all-groups ruff check .
      - run: uv run --all-groups python -m pytest -q tests  # includes JSON Schema, Croissant and JSON-LD checks
      - name: app starts and answers (extractive, no key)
        run: |
          uv run --all-groups uvicorn app:app --port 8791 &
          for i in $(seq 1 60); do curl -sf localhost:8791/api/health | grep -q '"ready":true' && break; sleep 2; done
          curl -sf localhost:8791/api/ask -H 'Content-Type: application/json' -d '{"question":"Wie viele Kinder besuchten die Schule in Hörndli?"}' | grep -q "1421"
