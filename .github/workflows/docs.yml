name: docs
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - name: upload the built site
        # No deploy: the repository is private under a personal GitHub account and GitHub Pages is
        # unavailable, so the compiled site ships as a workflow artifact instead.
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/dist
          if-no-files-found: error
