# Environment, test and lint configuration. The runtime dependencies live in [project].dependencies and the
# non-runtime ones in [dependency-groups]; `uv.lock` pins the whole resolution and is committed, so the Dockerfile,
# CI and the Justfile all install from it. This repository is an application (`PYTHONPATH=src python -m archai.<module>`)
# and is published nowhere, so it deliberately carries no [build-system] table, no `[tool.uv] package = true` and no
# [project.scripts] entry point: dependency management only, no packaging.
# The ruff rule set below accepts the codebase's compact own style on purpose and reports only correctness and
# dead-code problems, so that adding the linter does not rewrite the tree or destroy git blame.

[project]
name = "archai"
version = "0.1.0"
description = "Deciphering Swiss archives with Apertus: three open Swiss archive datasets turned into one AI-ready, provenance-preserving dataset, served as a cited Q&A demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # pipeline
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "openpyxl>=3.1.5",
    # web demo
    "fastapi>=0.143.5",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
    # statistics (whole-corpus aggregates over the parquet, app.py /api/stats)
    "duckdb>=1.5.6",
]

[dependency-groups]
# unit tests (`just test`); jsonschema validates every record, pytest runs the suite
test = [
    "pytest>=9.1.1",
    "jsonschema>=4.26.0",
]
# interoperability validators (`just check`, CI): Croissant and JSON-LD checks behind pytest.importorskip
dev = [
    "mlcroissant>=1.1.1",
    "PyLD>=3.3.0",
]
lint = [
    "ruff",
]
# `just notebook` executes notebooks/demo.ipynb in place and needs a kernel
notebook = [
    "nbclient",
    "ipykernel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
pythonpath = ["src"]

[tool.ruff]
# Measured line lengths on main: p50 45, p90 114, p99 152, max 256. 120 clears p90 without a reformat;
# ruff's 88 default would leave hundreds of E501 findings and force one.
line-length = 120
# Runtime is Python 3.12: Dockerfile `FROM python:3.12-slim`, Makefile `PY ?= python3.12`, CI python-version "3.12".
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]  # pycodestyle errors, pyflakes, pycodestyle warnings, flake8-bugbear
ignore = [
    "E501",  # line-too-long: lines are written for narrow review diffs, not for a column ruler (see line-length above)
    "E702",  # multiple-statements-on-one-line-semicolon: `p = Path(path); raw = p.read_bytes()` is used throughout
    "E701",  # multiple-statements-on-one-line-colon: the same compact one-liner idiom as E702
    "E741",  # ambiguous-variable-name: one-letter names such as `l` are deliberate in these short loops
    "E401",  # multiple-imports-on-one-line: `import argparse, csv, datetime as dt, ...` is the house import style
    "E402",  # module-import-not-at-top-of-file: app.py imports after its os.chdir / sys.path setup, which must come first
    "E731",  # lambda-assignment: the compact local-helper idiom used in onboard.py and qa.py
]
# Deliberately not selected: I (import sorting), N (pep8-naming) and D (docstrings). Those fight the existing
# style, and D would additionally require authoring docstrings for every public function, class and module.

[tool.ruff.format]
# Formatting is deliberately not enforced on this codebase, and no target runs `ruff format`: it would rewrite
# 20 of the 21 Python files. The quote style is recorded here for anyone who does run it by hand.
quote-style = "double"
